services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    volumes:
      - redis-data:/data
    command: ["redis-stack-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  semantic-cache:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
    ports:
      - "127.0.0.1:3000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.75}
      CACHE_TTL_EVERGREEN_SECONDS: ${CACHE_TTL_EVERGREEN_SECONDS:-86400}
      CACHE_TTL_TIME_SENSITIVE_SECONDS: ${CACHE_TTL_TIME_SENSITIVE_SECONDS:-3600}
      MAX_CACHE_SIZE: ${MAX_CACHE_SIZE:-10000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-local}
      MAX_QUERY_CHARS: ${MAX_QUERY_CHARS:-4000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
    driver: local